g two of them.`,time:25,composure:-12,loyalty:{[e.actor.id]:-4}})}]},{id:"calm_holds",stages:["security","extraction","escape"],weight:6,actor:{trait:"calm"},when:e=>e.run.noise>25,title:"Somebody has to be the adult",body:"The room has gone loud and fast. {actor} has not raised their voice and is telling everyone, one at a time, what they are doing next.",choices:[{id:"let_them",label:"Let them run it",hint:"Hand the room over for a minute.",resolve:e=>({text:`It works. ${R(e)} talks the crew down to something like a pace.`,noise:-18,composure:10,time:25})},{id:"keep_moving",label:"Keep moving",hint:"No time. Out now.",resolve:()=>({text:"Everyone moves. Nobody is calm. It is faster and it is worse.",time:-40,noise:8})}]},{id:"excop_radio",stages:["security","extraction","escape"],weight:7,actor:{trait:"excop"},title:"That call was about us",body:"{actor} has been listening to the band all night and has just gone quiet. A unit has been given this address and a reason.",choices:[{id:"go_now",label:"Leave now, with what you have",hint:"Every second from here is worse than the last.",resolve:()=>({text:"The bags are half full and everyone is already walking.",time:-70,takeMul:-.12,noise:-5})},{id:"reroute_out",label:"Take the route they will not cover",hint:"They know how the response is drawn. They used to draw it.",check:{attr:"security",dc:55},resolve:(e,t)=>t?{text:`${R(e)} calls the streets in order, and the crew are two blocks clear before the first car arrives.`,time:30,heat:-3}:{text:"The response has changed since they left the job. The road is already shut.",time:80,noise:15}}]},{id:"charmer_witness",stages:["approach","extraction"],weight:7,actor:{trait:"charmer"},title:"A witness, being friendly",body:"A woman walking a dog has stopped to talk to {actor}, who is standing next to a van that should not be there, holding something they should not be holding.",choices:[{id:"charm",label:"Talk to her",hint:"Be the most boring man alive for ninety seconds.",check:{attr:"social",dc:45},resolve:(e,t)=>t?{text:`She hears a long, dull story about a broken boiler and leaves ${R(e)} with a description she will not be able to reproduce.`,time:60,heat:-2}:{text:"She is not interested in the boiler. She is interested in the van, and she reads plates for a living.",time:40,heat:5}},{id:"ignore",label:"Get in the van",hint:"Say nothing. Be a shape in a coat.",resolve:()=>({text:"The door shuts. She stands there a moment longer than anyone would like.",heat:3,time:-10})}]},{id:"jammer_fails",stages:["security"],weight:9,actor:{role:"hacker"},when:e=>e.hasKit("jammer"),title:"The jammer is doing nothing",body:"{actor} is holding a very expensive box with a green light on it. The cameras are still talking to something.",choices:[{id:"physical",label:"Do it by hand",hint:"Find the cable. Cut the cable.",check:{attr:"technical",dc:58},resolve:(e,t)=>t?{text:`${R(e)} finds the run above the ceiling tile and takes the whole floor's coverage out at once.`,time:90,noise:6}:{text:"Wrong cable. Something else has stopped working and it is the kind of thing people notice from an office.",time:100,noise:20,alarm:!0}},{id:"blind_spots",label:"Work the blind spots",hint:"Accept the cameras and move where they are not.",when:e=>e.knows("cameras"),resolve:()=>({text:"The coverage map earns its money. Everyone moves in short, stupid-looking hops and nothing is recorded.",time:70,noise:-4})},{id:"risk_it",label:"Work in front of them",hint:"Faces covered, heads down, and hope.",resolve:()=>({text:"Eleven minutes of everyone on tape. Not identifiable. Not nothing, either.",heat:7,time:-20})}]},{id:"wrong_safe",stages:["objective"],weight:10,actor:{role:"safecracker"},when:e=>!e.knows("vault"),title:"That is not the safe you were told about",body:"{actor} is looking at a door that is nine years newer than the one described, with a keypad nobody mentioned.",choices:[{id:"work_it",label:"Work it anyway",hint:"Slower, harder, and entirely on their nerve.",check:{attr:"security",dc:68},resolve:(e,t)=>t?{text:`It takes ${R(e)} four times as long as it should have, and it opens.`,time:190,noise:8,composure:8}:{text:"It does not open. It will not open tonight, for anyone, with this kit.",time:210,noise:12,takeMul:-.45,composure:-15}},{id:"cut",label:"Cut it",hint:"Loud, hot, certain.",when:e=>e.hasKit("torch")||e.hasKit("drill"),resolve:()=>({text:"The room fills with the smell of it. The door comes off in one piece and lands badly.",time:120,noise:30,takeMul:-.05})},{id:"leave_it",label:"Take what is outside it",hint:"The counter, the drawers, the display. Not the safe.",resolve:()=>({text:"Everything that was not behind a door goes into the bags. It is not what you came for.",time:-60,takeMul:-.35,noise:-6})}]},{id:"second_vault",stages:["objective"],weight:3,actor:{any:!0},when:e=>e.run.noise<40&&!e.run.alarm,title:"There is a second room",body:"Behind the racking, {actor} has found a door that is not on any plan you bought. It is older than the rest of the building and it is not locked with anything modern.",choices:[{id:"open_it",label:"Open it",hint:"You have no idea what is in there. That is the point.",check:{attr:"security",dc:50},resolve:(e,t)=>t?{text:`It is the overflow room. Nobody has counted what is in here in a long time, and ${R(e)} is laughing in a way you have not heard before.`,time:130,bonusTake:Math.round(e.target.value*.4),composure:12}:{text:"Empty. Boxes of paper, a dead phone line and eight minutes you will not get back.",time:150,noise:6,composure:-6}},{id:"walk_past",label:"Leave it",hint:"You came for a thing. You have the thing.",resolve:()=>({text:"The door stays shut. Somebody will wonder about it for years.",time:-15})}]},{id:"night_cleaner",stages:["entry","security"],weight:8,actor:{any:!0},when:e=>!e.knows("rotation"),title:"There is someone still in the building",body:"A radio is playing two floors up. Nobody bought the rotation, so nobody — {actor} included — knows who that is or when they go home.",choices:[{id:"wait",label:"Wait them out",hint:"Time is the only currency you have left.",resolve:()=>({text:"Nineteen minutes in a stairwell listening to a phone-in show. Then a door, and a lift, and quiet.",time:240,noise:-10})},{id:"avoid",label:"Work around them",hint:"Two floors is two floors.",check:{attr:"stealth",dc:52},resolve:(e,t)=>t?{text:`${R(e)} maps the noise and everyone moves in the gaps between songs.`,time:50,noise:4}:{text:"The radio stops. Somebody upstairs is standing very still, listening, exactly as you are.",time:70,noise:22}},{id:"contain",label:"Go and get them",hint:"Fast, quiet, and a person who has seen you.",when:e=>e.has("muscle"),resolve:()=>({text:"It takes forty seconds and no one is hurt. There is now a witness who has been in a room with your crew.",time:45,heat:8,noise:8})}]},{id:"silent_alarm",stages:["security","objective"],weight:7,actor:{role:"hacker"},when:e=>!e.run.alarm&&e.run.clock>200,title:"It has been quiet for too long",body:"{actor} cannot find the alarm circuit, because there is nothing to find. It has been reporting to a monitoring company since the moment the door opened.",choices:[{id:"sprint",label:"Everything you can carry, now",hint:"Assume the clock has been running the whole time.",resolve:()=>({text:"The plan is over. What follows is four people running with bags.",time:-110,takeMul:-.15,alarm:!0,noise:12})},{id:"call_it_bluff",label:"Finish the job",hint:"If they were coming they would be here.",check:{attr:"nerve",dc:60},resolve:(e,t)=>t?{text:`Nothing comes. ${R(e)} was wrong about the circuit and everyone is very polite about it afterwards.`,time:40,composure:-4}:{text:"They were coming. They were just being quiet about it, the way you were.",alarm:!0,time:60,noise:25}}]},{id:"blocked_road",stages:["escape"],weight:9,actor:{role:"driver"},title:"The road is shut",body:"Roadworks that were not there on the scout. {actor} has about four seconds to choose something.",choices:[{id:"improvise",label:"Let them improvise",hint:"They know these streets better than the plan does.",check:{attr:"driving",dc:58},resolve:(e,t)=>t?{text:`${R(e)} takes the van through the industrial estate, over a kerb, and out onto the harbour road going the wrong way. It is the best driving you have ever seen.`,time:-60,heat:-3,composure:10}:{text:"It is a dead end with a fence at the end of it. Reversing out takes a long, loud minute.",time:90,noise:20}},{id:"ditch",label:"Ditch the van and split up",hint:"Slower, safer, and the take goes in four directions.",resolve:()=>({text:"The van is left in a car park with the doors open. Everyone walks, separately, carrying too much.",time:140,takeMul:-.08,heat:-6})}]},{id:"crowd_outside",stages:["extraction"],weight:7,actor:{role:"face"},when:e=>e.approach.id==="social"||e.approach.id==="inside",title:"The doors are full of people",body:"Somebody has pulled the fire alarm two units down and the street is full. {actor} is holding a bag and wearing a uniform that half these people can read.",choices:[{id:"walk_through",label:"Walk straight through it",hint:"Confidence, a clipboard and a firm sense of direction.",check:{attr:"social",dc:55},resolve:(e,t)=>t?{text:`${R(e)} directs four members of the public to a muster point that does not exist, and is thanked for it.`,time:-30,heat:-2,composure:8}:{text:"Somebody asks which company they are with. Somebody else takes a photograph of the answer.",time:50,heat:9}},{id:"back_out",label:"Go back in and wait",hint:"The crowd will thin. The clock will not.",resolve:()=>({text:"Eight minutes in a store cupboard with the bags between everyone’s feet.",time:180,noise:-6})}]},{id:"insider_wobbles",stages:["entry","security","objective"],weight:9,actor:{any:!0},when:e=>e.approach.id==="inside",title:"Your inside man has stopped answering",body:"The door that was supposed to be unlocked is not, and the phone rings out. {actor} says they saw him on the floor twenty minutes ago and he would not make eye contact.",choices:[{id:"wait_him_out",label:"Give him two more minutes",hint:"He has more to lose than you do.",check:{attr:"nerve",dc:50},resolve:(e,t)=>t?{text:"The lock clicks. He does not come to the door and he does not look up.",time:120}:{text:`He has gone home. ${R(e)} finds the door still shut and the corridor now on a camera that is definitely working.`,time:140,noise:16,takeMul:-.1}},{id:"force_it",label:"Do it without him",hint:"The plan assumed a man who is not here.",check:{attr:"technical",dc:62},resolve:(e,t)=>t?{text:`${R(e)} takes the door off its own hinges, quietly, in about four minutes.`,time:200,noise:10}:{text:"The door wins. The frame does not, and the noise it makes is architectural.",time:160,noise:32,alarm:!0}}]},{id:"panic_split",stages:["extraction","escape"],weight:8,actor:{any:!0},when:e=>e.run.policeOnSite||e.run.noise>55,title:"Somebody has run",body:"When the second siren started, {actor} went out through a different door and is now somewhere in the building or somewhere in the city.",choices:[{id:"go_back",label:"Go back for them",hint:"You do not leave people. It is expensive.",check:{attr:"nerve",dc:55},resolve:(e,t)=>t?{text:`${R(e)} is found in a service corridor, and will remember who came back.`,time:100,composure:15,loyalty:{[e.actor.id]:12}}:{text:"Two minutes of shouting into a stairwell, and then no choice at all.",time:120,separate:!0,noise:14,loyalty:{[e.actor.id]:-10}}},{id:"leave_them",label:"Leave without them",hint:"They know the fallback. They might use it.",resolve:e=>({text:`The van goes. ${R(e)} is on foot, in a city with its lights on.`,separate:!0,time:-50,loyalty:{[e.actor.id]:-18}})}]},{id:"deposit_boxes",stages:["objective"],weight:6,actor:{any:!0},when:e=>e.approach.id==="aggressive"&&e.run.clock<300,title:"You are ahead of the clock",body:"The bags are full and there are still minutes on the board. {actor} is looking at the boxes on the far wall.",choices:[{id:"boxes",label:"Do the boxes",hint:"Two minutes of noise for an unknown amount of money.",resolve:e=>({text:"They come off the wall in rows. Half of them hold paperwork and jewellery nobody insured.",time:130,noise:22,bonusTake:Math.round(e.target.value*.22)})},{id:"go",label:"Leave early",hint:"Being gone before you are expected is worth money.",resolve:()=>({text:"The crew are in the vehicle a full two minutes before the plan said they would be.",time:-60,heat:-5,noise:-10})}]},{id:"vault_spec_pays",stages:["objective"],weight:8,actor:{role:"safecracker"},when:e=>e.knows("vault"),title:"Exactly as described",body:"The door is the model in the file, in the condition the file said, with the drift the file mentioned. {actor} has done this one before, on paper, at a kitchen table.",choices:[{id:"by_the_book",label:"Work the file",hint:"The information you bought is the whole job now.",resolve:e=>({text:`${R(e)} does not hurry and does not stop, and the door comes open a clean four minutes early.`,time:-100,noise:-8,composure:10})},{id:"greedy_open",label:"Open the deposit wall too",hint:"You know this room now. You will not know it again.",check:{attr:"security",dc:60},resolve:(e,t)=>t?{text:"The wall comes off in sections and there is a great deal behind it that nobody insured.",time:110,noise:12,bonusTake:Math.round(e.target.value*.3)}:{text:`${R(e)} gets two of them open and jams the third so thoroughly that the room is now a crime scene with a signature on it.`,time:120,noise:18,heat:6}}]},{id:"no_entry_tool",stages:["entry"],weight:9,actor:{any:!0},when:e=>!e.equipment.some(t=>t.tag==="entry"),title:"Nobody brought anything for this",body:"The lock is modern, it is well fitted, and {actor} is looking at it holding a screwdriver and an expression.",choices:[{id:"improvise",label:"Improvise",hint:"Hands, patience, and something that was not designed for this.",check:{attr:"technical",dc:62},resolve:(e,t)=>t?{text:`${R(e)} takes the cylinder out of the door in about six minutes using a tool meant for something else entirely.`,time:150,noise:6,composure:8}:{text:"The screwdriver wins an argument with the frame. The frame is louder about it than anyone expected.",time:130,noise:26,alarm:!0}},{id:"window",label:"Find another way in",hint:"Every building has a door somebody forgot about.",check:{attr:"stealth",dc:52},resolve:(e,t)=>t?{text:`${R(e)} finds a fire door propped for a cigarette break that ended an hour ago.`,time:90,noise:2}:{text:"Twelve minutes of walking round a building at night, which is exactly as conspicuous as it sounds.",time:200,noise:14}}]},{id:"scout_read_it",stages:["approach"],weight:7,actor:{role:"scout"},title:"That car has been there both nights",body:"{actor} has noticed a vehicle parked where a vehicle was parked the last time they walked this street, with somebody in it.",choices:[{id:"wait",label:"Wait for it to move",hint:"It might be nothing. It might be the job.",resolve:e=>({text:`It moves at twenty past. ${R(e)} does not say what they think it was and nobody asks.`,time:160,noise:-6})},{id:"around",label:"Go the long way",hint:"Add ten minutes, subtract a witness.",resolve:()=>({text:"Everyone approaches from the market side instead, through a service yard nobody watches.",time:110,heat:-3})},{id:"ignore_car",label:"Walk past it",hint:"It is a man asleep in a car.",check:{attr:"nerve",dc:48},resolve:(e,t)=>t?{text:"It is a man asleep in a car.",time:-30}:{text:`It is not a man asleep in a car, and ${R(e)} realises this at the moment of walking past the window.`,heat:8,noise:10}}]},{id:"muscle_known",stages:["approach","extraction"],weight:7,actor:{role:"muscle"},title:"Somebody knows their face",body:"A man on the door has spent nine seconds looking at {actor} and is now looking at them differently.",choices:[{id:"front_it",label:"Front it out",hint:"Be the last person he would like to be wrong about.",check:{attr:"nerve",dc:55},resolve:(e,t)=>t?{text:`${R(e)} holds the look until it is returned to sender, and the man finds something else to do.`,time:30,composure:6}:{text:"He decides he is sure. He does not say anything, which is worse, because it means he is telling somebody else.",heat:10,noise:8}},{id:"swap",label:"Send somebody else",hint:"Pull them out and rearrange the plan around it.",resolve:e=>({text:`${R(e)} sits the next ten minutes out in a doorway, furious and useful to nobody.`,time:80,takeMul:-.05,composure:-8})}]},{id:"shaking_hands",stages:["objective"],weight:8,actor:{role:"safecracker"},when:e=>e.run.noise>30||e.run.alarm,title:"Not with this going on",body:"Something loud happened two rooms ago and {actor} has stopped, hands flat on the door, waiting for a building that will not go quiet.",choices:[{id:"give_time",label:"Give them the room",hint:"Everyone else stops moving. It costs whatever it costs.",resolve:e=>({text:`Ninety seconds of nobody breathing, and then ${R(e)}'s hands are steady again.`,time:100,composure:14})},{id:"push_them",label:"Tell them to work",hint:"There is no version of tonight with a spare ninety seconds in it.",check:{attr:"nerve",dc:58},resolve:(e,t)=>t?{text:`${R(e)} works angry and works well, which is not the same as forgiving you for it.`,time:-40,loyalty:{[e.actor.id]:-6}}:{text:"They cannot do it. They genuinely cannot, and everybody watching them try makes it worse.",time:130,takeMul:-.2,composure:-18}}]},{id:"driver_holding",stages:["extraction"],weight:8,actor:{role:"driver"},when:e=>e.run.policeOnSite||e.run.exposedAt!==null,title:"The van cannot sit here",body:"{actor} is on the radio saying a marked car has passed the end of the street twice and the third time will not be a pass.",choices:[{id:"circle",label:"Have them circle",hint:"A moving vehicle is a vehicle going somewhere.",resolve:e=>({text:`${R(e)} takes the van round the block on a loop, and the pickup point becomes a moving target for everyone including you.`,time:70,noise:-6})},{id:"now",label:"Come out now, ready or not",hint:"Whatever is in the bags is what you are leaving
